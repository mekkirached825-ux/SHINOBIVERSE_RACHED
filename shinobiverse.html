<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINOBIVERSE | عالم الشينوبي</title>
<style>
:root{--bg:#090c13;--panel:#111824;--line:#263244;--gold:#e2b55b;--muted:#98a5b8;--text:#edf2fa;--blue:#54a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#1a2337 0%,#090c13 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}header,main,.modal{position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;border-bottom:1px solid #ffffff12;background:#070a10aa;backdrop-filter:blur(10px)}.brand{font-weight:900;letter-spacing:2px;font-size:1.25rem}.brand span{color:var(--gold)}.nav{color:var(--muted);font-size:.85rem}.hero{text-align:center;padding:56px 16px 26px}.hero h1{font-size:clamp(2rem,7vw,4rem);margin:0;text-shadow:0 0 30px #e2b55b22}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);max-width:600px;margin:14px auto}.searchrow{display:flex;gap:10px;max-width:720px;margin:25px auto 0;padding:0 10px}.searchrow input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid var(--line);background:#111824;color:white}.searchrow button,.btn{border:0;border-radius:12px;background:var(--gold);color:#111;padding:12px 18px;font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px 20px}.filter{background:#111824;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}.filter.active{border-color:var(--gold);color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;padding:16px 5% 60px}.card{background:linear-gradient(160deg,#172133,#0c111a);border:1px solid var(--line);border-radius:18px;padding:18px;transition:.22s;cursor:pointer;position:relative;overflow:hidden}.card:hover{transform:translateY(-4px);border-color:#e2b55b88;box-shadow:0 12px 32px #0006}.portrait{height:150px;border-radius:13px;display:grid;place-items:center;font-size:3.3rem;background:radial-gradient(circle,#344764,#101621 72%);border:1px solid #ffffff12}.card h3{margin:12px 0 4px}.card p{margin:0;color:var(--muted);font-size:.85rem}.tag{font-size:.72rem;color:var(--gold);margin-top:10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:4}.modal.show{display:flex}.chat{width:min(780px,100%);height:min(85vh,800px);background:#0e1520;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}.chathead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.chathead small{color:var(--muted)}.close{background:#202b3b;border:0;color:white;border-radius:9px;padding:8px 12px;cursor:pointer}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.6}.msg.bot{background:#182437;align-self:flex-start;border:1px solid #263a55}.msg.user{background:#8d6a2d;align-self:flex-end;color:white}.chatfoot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.chatfoot textarea{flex:1;resize:none;min-height:46px;max-height:120px;background:#101a28;border:1px solid var(--line);color:white;border-radius:12px;padding:12px}.chatfoot button{background:var(--gold);border:0;border-radius:12px;padding:0 18px;font-weight:800}.note{color:var(--muted);font-size:.75rem;text-align:center;padding:0 15px 12px}.empty{color:var(--muted);text-align:center;grid-column:1/-1;padding:35px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182437;border:1px solid var(--line);padding:12px 18px;border-radius:12px;display:none;z-index:5}
</style></head><body><canvas id="fx"></canvas>
<header class="top"><div class="brand">SHINO<span>BI</span>VERSE</div><div class="nav">بوابة إلى عالم الشينوبي</div></header>
<main><section class="hero"><h1>اختر شينوبي <span>وتحدث معه</span></h1><p>استكشف الشخصيات، افتح محادثة، وانطلق في حوار تفاعلي داخل عالم مستوحى من ناروتو.</p><div class="searchrow"><input id="search" placeholder="ابحث عن شخصية..." aria-label="بحث عن شخصية"><button id="searchBtn">بحث</button></div></section>
<div class="filters" id="filters"><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="leaf">الورقة</button><button class="filter" data-filter="other">شخصيات أخرى</button></div><section class="grid" id="grid"></section></main>
<div class="modal" id="modal"><div class="chat"><div class="chathead"><div><strong id="chatName">شخصية</strong><br><small id="chatTitle"></small></div><button class="close" id="close">إغلاق</button></div><div class="messages" id="messages"></div><div class="chatfoot"><textarea id="prompt" placeholder="اكتب رسالتك..."></textarea><button id="send">إرسال</button></div><div class="note">المحادثات خيالية وتفاعلية. لا تشارك معلومات شخصية أو أسرارًا.</div></div></div><div class="toast" id="toast"></div>
<script>
const chars=[
{id:'naruto',name:'ناروتو أوزوماكي',title:'الهوكاجي السابع',emoji:'🍥',group:'leaf',intro:'أنا ناروتو! ما الذي تريد أن نتحدث عنه؟'},
{id:'sasuke',name:'ساسكي أوتشيها',title:'النينجا المتجول',emoji:'⚡',group:'leaf',intro:'همم. ما الذي تريد معرفته؟'},
{id:'sakura',name:'ساكورا هارونو',title:'نينجا طبية',emoji:'🌸',group:'leaf',intro:'أهلًا! كيف يمكنني مساعدتك؟'},
{id:'kakashi',name:'كاكاشي هاتاكي',title:'النينجا الناسخ',emoji:'📘',group:'leaf',intro:'وصلت في الوقت المناسب... تقريبًا. ما الموضوع؟'},
{id:'shikamaru',name:'شيكامارو',title:'استراتيجي',emoji:'♟️',group:'leaf',intro:'يبدو الأمر متعبًا... لكن أخبرني.'},
{id:'hinata',name:'هيناتا',title:'البياكوغان',emoji:'💠',group:'leaf',intro:'مرحبًا... يسعدني التحدث معك.'},
{id:'gaara',name:'غارا',title:'كازيكاغي',emoji:'🏜️',group:'other',intro:'ما الذي يشغل بالك؟'},
{id:'itachi',name:'إيتاتشي',title:'أوتشيها',emoji:'🌑',group:'other',intro:'تحدث. سأستمع.'},
{id:'jiraiya',name:'جيرايا',title:'الناسك',emoji:'📜',group:'other',intro:'هاها! ما القصة؟'},
{id:'rocklee',name:'روك لي',title:'قوة الشباب',emoji:'🥋',group:'leaf',intro:'لنمنح الحديث طاقة الشباب!'},
{id:'minato',name:'ميناتو',title:'الهوكاجي الرابع',emoji:'✨',group:'leaf',intro:'أهلًا بك. كيف أساعدك؟'},
{id:'madara',name:'مادارا',title:'أسطورة الأوتشيها',emoji:'🔥',group:'other',intro:'إذن، ما الذي تريد مناقشته؟'}];
let filter='all',current=null,history=[];const grid=document.getElementById('grid'),modal=document.getElementById('modal'),messages=document.getElementById('messages');
function render(){let q=document.getElementById('search').value.trim().toLowerCase();let list=chars.filter(c=>(filter==='all'||c.group===filter)&&(!q||c.name.toLowerCase().includes(q)||c.title.toLowerCase().includes(q)));grid.innerHTML=list.length?list.map(c=>`<article class="card" data-id="${c.id}"><div class="portrait">${c.emoji}</div><h3>${c.name}</h3><p>${c.title}</p><div class="tag">اضغط لبدء المحادثة</div></article>`).join(''):'<div class="empty">لم نجد الشخصية المطلوبة.</div>';grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>openChar(chars.find(c=>c.id===el.dataset.id)));}
function openChar(c){current=c;history=[];document.getElementById('chatName').textContent=c.name;document.getElementById('chatTitle').textContent=c.title;messages.innerHTML='';addMsg(c.intro,'bot');modal.classList.add('show');document.getElementById('prompt').focus()}
function addMsg(t,who){let d=document.createElement('div');d.className='msg '+who;d.textContent=t;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
async function send(){let input=document.getElementById('prompt'),text=input.value.trim();if(!text||!current)return;input.value='';addMsg(text,'user');history.push({role:'user',content:text});let loading=document.createElement('div');loading.className='msg bot';loading.textContent='...';messages.appendChild(loading);try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character:current.name,title:current.title,message:text,history:history.slice(-10)})});if(!r.ok)throw new Error('not ready');let data=await r.json();loading.remove();let reply=data.reply||'لم يصل رد.';addMsg(reply,'bot');history.push({role:'assistant',content:reply})}catch(e){loading.remove();addMsg('الخادم غير متصل أو لم تُضبط خدمة الذكاء الاصطناعي بعد. يمكن نشر الموقع أولًا ثم ربط الخدمة.','bot');toast('تعذر الاتصال بالخادم')}}
document.getElementById('send').onclick=send;document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.getElementById('search').oninput=render;document.getElementById('searchBtn').onclick=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});render();
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let dots=[];function resize(){canvas.width=innerWidth;canvas.height=innerHeight;dots=Array.from({length:75},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,v:Math.random()*.35+.08,r:Math.random()*2+1}))}function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);dots.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=canvas.height;p.x=Math.random()*canvas.width}ctx.fillStyle='rgba(226,181,91,.7)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(animate)}addEventListener('resize',resize);resize();animate();
</script></body></html>
